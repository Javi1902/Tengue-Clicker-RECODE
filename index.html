<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tengue clicker RECODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="title">
      <h1 class="textTitle">
        tengue clicker
        <span class="textoSmall">recode</span>
      </h1>
    </header>

    <dialog id="rebirthMenu">
      <h2 class="subtitle">Tienda</h2>
      <button id="shopBtn1" class="btnTiendaNormal">
        Comprar Noli --- <span id="mejoraNoliBalanceada">0</span> tps
        (tengues/click)
      </button>
      <p class="costoTienda">
        Costo: <span id="precioNoliAjustable">1</span> Ascención/es
      </p>

      <button id="shopBtn2" class="btnTiendaNormal">placeholder</button><br />
      <button id="shopBtn3" class="btnTiendaNormal">placeholder</button><br />
      <button id="shopBtn4" class="btnTiendaNormal">placeholder</button>

      <button id="closeMenuBtn">✕</button>
      <p class="costoTienda" style="margin-top: 14px">
        Ascenciones: <span id="rebirthDisplayModal">0</span>
      </p>
    </dialog>

    <div class="main-layout">
      <div class="juegoPrincipal">
        <button class="btnPrincipal" id="btn">tengue</button>
        <p class="puntaje">
          Puntaje: <br /><span class="display" id="puntajeDisplay">0</span>
        </p>

        <div class="utilityContainer">
          <button class="btn" id="prestigeBtn">Convertir tenguenarios</button>
          <button class="btn" id="rebirthBtn">
            Ascender --- <span id="prestigeRebirth">30</span> tenguenarios
          </button>
        </div>
      </div>

      <div class="displays">
        <p class="multDisp">
          Tu tienes <br /><span class="display" id="multiplierDisplay">1</span
          ><br />
          tengues/click
        </p>
        <p>
          Tu tienes <br /><span class="display" id="prestigeDisplay">0</span
          ><br />
          tenguenario/s
        </p>
        <p>
          Tu has revivido <br /><span class="display" id="rebirthDisplay"
            >0</span
          ><br />
          veces
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
